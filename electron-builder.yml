appId: com.veil.vpn.desktop
productName: VEIL VPN
copyright: Copyright © 2026 VEIL Network
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/icon.ico
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
publish:
  provider: github
  owner: ayyub11289
  repo: newvpn
  releaseType: release
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: true
  verifyUpdateCodeSignature: true
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    publisherName:
      - VEIL Network
    rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  artifactName: VEIL-VPN-${version}-win-${arch}-Setup.${ext}
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VEIL VPN
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
portable:
  artifactName: VEIL-VPN-${version}-win-${arch}-Portable.${ext}
