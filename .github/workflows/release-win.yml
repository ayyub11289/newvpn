name: Build & Release VEIL VPN (Windows 11)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version tag (e.g. v1.1.0). Leave empty to use package.json version."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Resolve release version and sync package.json
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.release_tag }}"
          if (-not $tag -and "${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag) {
            $version = $tag.TrimStart("v")
            npm version $version --no-git-tag-version --allow-same-version
          } else {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $version = $pkg.version
            $tag = "v$version"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag (version $version)"

      - name: Fetch official sing-box & wintun core binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch-core

      - name: Generate Windows application icon
        run: npm run gen-icon

      - name: Typecheck, build & verify sing-box 1.14 config compatibility
        run: |
          npm run typecheck
          npm run build
          npm run verify-core-config

      - name: Package Windows Installer & Portable (.exe)
        run: npx electron-builder --win --publish never

      - name: Publish GitHub Release with Installer, Portable & latest.yml
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $files = @(
            Get-ChildItem release\*.exe
            Get-ChildItem release\*.blockmap -ErrorAction SilentlyContinue
            Get-ChildItem release\latest.yml -ErrorAction SilentlyContinue
          ) | ForEach-Object { $_.FullName }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "VEIL VPN $tag" --generate-notes
          }

      - name: Upload build artifacts to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: VEIL-VPN-Windows-x64
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: warn
